[platformio]
default_envs = cardputer-adv

[env]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow

[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.flash_size = 8MB
# 自訂分割表：拿掉不使用的 OTA 分割，換成 4.9 MB 的 logfs 給訊息與語音歷史。
board_build.partitions = partitions/cmt-adv-8mb.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCMT_REGION_TW=1
    -DCMT_ENABLE_VOICE=1
    -DCODEC2_MODE_EN_DEFAULT=0
    -DCODEC2_MODE_700C_EN=1
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    z3t0/IRremote@4.7.1
    jgromes/RadioLib@7.7.1
    mikalhart/TinyGPSPlus@1.1.0
    sh123/esp32_codec2@1.0.7

[env:native]
platform = native
test_framework = unity
build_src_filter =
    +<core/>
    -<platform/>
    -<ui/>
    -<main.cpp>
build_flags =
    ${env.build_flags}
    -DCMT_NATIVE_TEST=1
    -Iinclude
